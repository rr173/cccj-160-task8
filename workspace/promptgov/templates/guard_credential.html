<div class="note">
  <b>短期还原凭据已签发（明文令牌仅此一次显示，关闭后无法找回）。</b>
  凭据绑定请求 <span class="mono">{{ rid }}</span>、复核人 <b>{{ reviewer }}</b>，
  有效期 {{ ttl }} 秒（至 {{ expires_at }}），<b>只能使用一次</b>。
</div>
<div class="card">
  <h2>凭据</h2>
  <div class="kv">
    <div>credential_id</div><div class="mono">{{ credential_id }}</div>
    <div>复核人</div><div>{{ reviewer }}</div>
    <div>绑定请求</div><div class="mono"><a href="/requests/{{ rid }}/replay">{{ rid }}</a></div>
    <div>过期时刻</div><div>{{ expires_at }}</div>
  </div>
  <h3>一次性令牌</h3>
  <pre id="token">{{ token }}</pre>
  <form method="post" action="/ui/requests/{{ rid }}/reveal">
    <label>把令牌粘贴到此处立即还原（提交后凭据即刻消费，重复提交不会再次暴露原值）</label>
    <input name="token" value="{{ token }}">
    <div class="row" style="margin-top:10px"><button>立即还原原值</button>
      <a class="btn ghost" href="/requests/{{ rid }}/replay">返回请求复核页</a></div>
  </form>
</div>
